# Auto-generated by Shikshya — CI Pipeline
# Runs on every pull request to main
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ── Backend Tests ──────────────────────────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run migrations
        run: python manage.py makemigrations --check --dry-run && python manage.py migrate --noinput
        env:
          DEBUG: "1"
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'test-key-ci' }}
          DATABASE_URL: postgres://app:app@localhost:5432/app

      - name: Test
        run: python manage.py test --verbosity=2
        env:
          DEBUG: "1"
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'test-key-ci' }}
          DATABASE_URL: postgres://app:app@localhost:5432/app

  # ── Frontend Build ─────────────────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: CI=false npm run build
        env:
          VITE_API_URL: /api

  # ── Docker Build ───────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t patient_portal_clinic:${{ github.sha }} .

      - name: Smoke test (migrate, serve, readiness)
        run: |
          docker run -d --name smoke-test --network host -e PORT=8000 -e SECRET_KEY=ci-smoke-test-only-not-a-real-secret-0123456789 -e DATABASE_URL=postgres://app:app@localhost:5432/app -e ALLOWED_HOSTS=localhost patient_portal_clinic:${{ github.sha }}
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health/ready/ && break; sleep 2; done
          curl -sf http://localhost:8000/health/ready/ || (docker logs smoke-test; exit 1)
          docker rm -f smoke-test
