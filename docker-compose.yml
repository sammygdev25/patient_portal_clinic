# Runs the production image against PostgreSQL and Redis on this machine (generated by Shikshya):
#   SECRET_KEY=$(python3 -c "import secrets; print(secrets.token_urlsafe(50))") docker compose up --build
# Then open http://localhost:8000. The database listens on localhost only; plain http here, so the admin's secure
# cookies need a TLS proxy in front (the API signs in with a token and works without one).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:-app}@db:5432/app
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY to a long random value}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      SECURE_SSL_REDIRECT: "0"
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
volumes:
  pgdata: {}
